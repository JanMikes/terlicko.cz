# Frontend Release — build the Symfony frontend image and deploy it to lily via the
# shared reusable workflow (TheDevs-cz/ci). Replaces the old build + root-SSH
# deploy to spare.srv: the box now PULLS, and this repo holds no SSH key — only a
# per-app HMAC secret whose worst-case leak is "re-trigger this app's deploy".
#
# Still gated on `Frontend Tests`: runs only after that workflow succeeds on main.
#
# ONE HOOK, TWO WORKFLOWS: this and strapi.yml both pass `app: terlicko` — on lily
# the frontend and Strapi are one compose project (shared uploads volume). The path
# filters keep builds independent. See lily.srv D66.
#
# await_deploy is false: no commit-status token for this app on the box, and await
# is fail-closed (it would time out red).

name: Frontend Release

on:
  workflow_run:
    workflows: [Frontend Tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ship:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: TheDevs-cz/ci/.github/workflows/_ship.yml@v1
    secrets:
      DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
    with:
      app: terlicko                                  # hook id == /srv/<app> == compose project
      image: ghcr.io/janmikes/terlicko.cz            # image name != app slug -> explicit
      context: ./frontend
      build_args: |
        APP_VERSION=${{ github.event.workflow_run.head_sha }}
      deploy_host: lily.srv.thedevs.cz
      await_deploy: false
