# Strapi — build the Strapi CMS image and deploy it to lily via the shared reusable
# workflow (TheDevs-cz/ci). Replaces the old build + root-SSH deploy to spare.srv
# (whose deploy-strapi.sh rebuilt the admin panel on the host at every deploy —
# the image now bakes it, see strapi/Dockerfile).
#
# `target: prod` is REQUIRED — strapi/Dockerfile is multi-stage (`dev`, `prod`);
# only `prod` contains the built admin panel.
#
# ONE HOOK, TWO WORKFLOWS: see frontend-release.yml. See lily.srv D66.

name: Strapi

on:
  push:
    branches: [main]
    paths:
      - 'strapi/**'
      - '.github/workflows/strapi.yml'

permissions:
  contents: read
  packages: write

jobs:
  ship:
    uses: TheDevs-cz/ci/.github/workflows/_ship.yml@v1
    secrets:
      DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
    with:
      app: terlicko
      image: ghcr.io/janmikes/terlicko.cz-strapi
      context: ./strapi
      target: prod
      deploy_host: lily.srv.thedevs.cz
      await_deploy: false
